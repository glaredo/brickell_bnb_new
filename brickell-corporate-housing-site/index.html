<style>
  :root{
    --bone:#FBFAF6;
    --panel:#F3F1EA;
    --ink:#181B22;
    --slate:#6C7480;
    --rule:#DCD8CD;
    --bay:#2E5F8A;
    --bay-deep:#234B6E;
    --sand:#BE9A6C;
    --night:#0F1828;
    --night-panel:#16223A;
    --night-text:#E8ECF3;
    --night-dim:#9AA7BC;
    --night-rule:#2A3852;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bone);
    color:var(--ink);
    font-family:"Instrument Sans",system-ui,sans-serif;
    font-size:1.0625rem;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;}

  .wrap{max-width:74rem;margin:0 auto;padding:0 1.5rem;}

  .serif{font-family:"Fraunces",Georgia,serif;font-weight:400;font-variation-settings:"opsz" 100;}
  .kicker{
    font-size:.72rem;
    font-weight:600;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--bay);
    margin:0 0 .9rem;
  }

  /* ── masthead ─────────────────────────────── */
  .masthead{
    position:absolute;top:0;left:0;right:0;z-index:10;
    padding:1.4rem 0;
  }
  .masthead .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem;}
  .wordmark{
    color:#fff;
    font-size:.8rem;
    font-weight:600;
    letter-spacing:.22em;
    text-transform:uppercase;
    text-decoration:none;
    text-shadow:0 1px 10px rgba(10,16,28,.5);
  }
  .mast-actions{display:flex;align-items:center;gap:1.4rem;}
  .mast-phone{
    color:#fff;font-size:.9rem;font-weight:500;text-decoration:none;
    text-shadow:0 1px 10px rgba(10,16,28,.5);
  }
  .btn{
    display:inline-block;
    font-size:.78rem;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;
    text-decoration:none;
    padding:.85rem 1.6rem;
    border:1px solid currentColor;
    transition:background .2s ease,color .2s ease,border-color .2s ease;
  }
  .btn-ghost{color:#fff;}
  .btn-ghost:hover{background:#fff;color:var(--ink);}
  .btn-solid{background:var(--bay);border-color:var(--bay);color:#fff;}
  .btn-solid:hover{background:var(--bay-deep);border-color:var(--bay-deep);}

  /* ── hero ─────────────────────────────────── */
  .hero{
    position:relative;
    min-height:92svh;
    display:flex;align-items:flex-end;
    isolation:isolate;
    color:#fff;
  }
  .hero::before{
    content:"";position:absolute;inset:0;z-index:-2;
    background:url("images/hero.jpg") center 40%/cover no-repeat;
  }
  .hero::after{
    content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(to top,rgba(10,16,28,.72) 0%,rgba(10,16,28,.25) 45%,rgba(10,16,28,.18) 100%);
  }
  .hero .wrap{padding-bottom:4.5rem;width:100%;}
  .hero .eyebrow{
    font-size:.72rem;font-weight:600;
    letter-spacing:.2em;text-transform:uppercase;
    color:rgba(255,255,255,.85);
    margin:0 0 1.2rem;
  }
  .hero h1{
    font-size:clamp(3rem,8.5vw,6.5rem);
    line-height:.98;
    letter-spacing:-.01em;
    margin:0 0 1.4rem;
    font-weight:400;
    max-width:14ch;
  }
  .hero .sub{
    font-size:clamp(1.05rem,2vw,1.25rem);
    line-height:1.55;
    max-width:44ch;
    margin:0 0 2.2rem;
    color:rgba(255,255,255,.92);
  }
  .hero-ctas{display:flex;gap:1rem;flex-wrap:wrap;}

  /* ── fact strip ───────────────────────────── */
  .facts{border-bottom:1px solid var(--rule);}
  .facts .wrap{
    display:grid;
    grid-template-columns:repeat(5,1fr);
  }
  .fact{
    padding:1.6rem 1rem 1.75rem 0;
    border-left:1px solid var(--rule);
    padding-left:1.25rem;
  }
  .fact:first-child{border-left:0;padding-left:0;}
  .fact .value{
    font-family:"Fraunces",Georgia,serif;
    font-size:clamp(1.4rem,3vw,2rem);
    line-height:1;
  }
  .fact .label{
    font-size:.72rem;font-weight:500;
    letter-spacing:.12em;text-transform:uppercase;
    color:var(--slate);
    margin-top:.5rem;
  }

  /* ── pitch ────────────────────────────────── */
  .pitch{padding:5.5rem 0;}
  .pitch .wrap{
    display:grid;
    grid-template-columns:1.1fr 1fr;
    gap:4rem;
    align-items:start;
  }
  .pitch h2{
    font-size:clamp(2rem,4.5vw,3.2rem);
    line-height:1.1;
    margin:0;
    font-weight:400;
    max-width:16ch;
  }
  .pitch .body{margin:0 0 2rem;color:var(--ink);}
  .inc-list{list-style:none;margin:0;padding:0;}
  .inc-list li{
    padding:.75rem 0 .75rem 1.6rem;
    border-bottom:1px solid var(--rule);
    position:relative;
    font-size:.98rem;
  }
  .inc-list li::before{
    content:"";
    position:absolute;left:0;top:1.35rem;
    width:.55rem;height:1px;
    background:var(--sand);
  }

  /* ── rooms ────────────────────────────────── */
  .rooms{padding:1rem 0 3rem;}
  .room{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:4rem;
    align-items:center;
    padding:2.75rem 0;
  }
  .room:nth-child(even){grid-template-columns:.85fr 1.15fr;}
  .room:nth-child(even) .room-img{order:2;}
  .room-img{overflow:hidden;}
  .room-img img{aspect-ratio:3/2;object-fit:cover;width:100%;}
  .room h3{
    font-family:"Fraunces",Georgia,serif;
    font-weight:400;
    font-size:clamp(1.6rem,3vw,2.2rem);
    line-height:1.15;
    margin:0 0 1rem;
  }
  .room p{margin:0;color:var(--ink);max-width:42ch;}
  .room-stat{
    margin-top:1.6rem;
    padding-top:1.2rem;
    border-top:1px solid var(--rule);
    display:flex;align-items:baseline;gap:.9rem;
  }
  .room-stat .value{
    font-family:"Fraunces",Georgia,serif;
    font-size:1.7rem;
    color:var(--bay);
  }
  .room-stat .label{font-size:.8rem;color:var(--slate);letter-spacing:.06em;text-transform:uppercase;}

  /* ── walkthrough strip ────────────────────── */
  .walk{padding:2rem 0 1rem;}
  .walk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;}
  .walk-grid figure{margin:0;}
  .walk-grid img{aspect-ratio:16/9;object-fit:cover;width:100%;}

  /* ── balcony (signature) ──────────────────── */
  .balcony{padding:4rem 0 0;}
  .balcony-head{max-width:52rem;margin-bottom:3rem;}
  .balcony-head h2{
    font-size:clamp(2.2rem,5vw,3.6rem);
    line-height:1.05;margin:0 0 1.4rem;font-weight:400;
  }
  .balcony-head p{margin:0;max-width:56ch;}
  .balcony-full{width:100%;}
  .balcony-full img{width:100%;aspect-ratio:21/10;object-fit:cover;}
  .balcony-pair{
    display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;
    margin-top:1.5rem;padding-bottom:0;
  }
  .balcony-pair figure{margin:0;}
  .balcony-pair img{aspect-ratio:4/3;object-fit:cover;width:100%;}
  .cap{
    font-size:.78rem;color:var(--slate);
    letter-spacing:.08em;text-transform:uppercase;
    padding-top:.7rem;
  }

  /* ── building ─────────────────────────────── */
  .building{padding:5.5rem 0;}
  .building .wrap{
    display:grid;grid-template-columns:1fr 1.2fr;gap:4rem;align-items:start;
  }
  .building h2{
    font-size:clamp(1.9rem,4vw,2.8rem);
    line-height:1.1;margin:0 0 1.2rem;font-weight:400;
  }
  .building .body{margin:0 0 2rem;max-width:44ch;}
  .amen-grid{
    display:grid;grid-template-columns:1fr 1fr;
    border-top:1px solid var(--rule);
  }
  .amen{
    padding:.85rem .5rem .85rem 0;
    border-bottom:1px solid var(--rule);
    font-size:.95rem;
  }
  .amen:nth-child(odd){padding-right:1.5rem;}
  .building-imgs{display:grid;gap:1.5rem;}
  .building-imgs img{aspect-ratio:16/10;object-fit:cover;width:100%;}
  .building-imgs .duo{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;}
  .building-imgs .duo img{aspect-ratio:4/3;}

  /* ── neighborhood ─────────────────────────── */
  .hood{padding:0 0 5.5rem;}
  .hood .inner{
    background:var(--panel);
    padding:3.5rem 3.5rem;
    display:grid;grid-template-columns:1fr 1.3fr;gap:3rem;align-items:center;
  }
  .hood h2{
    font-size:clamp(1.9rem,4vw,2.8rem);
    line-height:1.1;margin:0;font-weight:400;
  }
  .hood p{margin:0;}

  /* ── rates ────────────────────────────────── */
  .rates-sec{padding:0 0 6rem;}
  .rates-sec .sec-head{max-width:40rem;margin-bottom:2.75rem;}
  .rates-sec h2{
    font-size:clamp(2rem,4.5vw,3.2rem);
    line-height:1.08;margin:0;font-weight:400;
  }
  .rate-cards{
    display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;
  }
  .rate-card{
    border:1px solid var(--rule);
    padding:2.2rem 2rem 2rem;
    display:flex;flex-direction:column;gap:.35rem;
  }
  .rate-card.featured{
    border-color:var(--bay);
    box-shadow:inset 0 3px 0 var(--bay);
  }
  .rate-card .period{
    font-size:.74rem;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;
    color:var(--slate);
  }
  .rate-card.featured .period{color:var(--bay);}
  .rate-card .price{
    font-family:"Fraunces",Georgia,serif;
    font-size:clamp(2.2rem,4vw,3rem);
    line-height:1.1;
    margin-top:.4rem;
  }
  .rate-card .per{font-size:.85rem;color:var(--slate);}
  .rate-card .note{
    margin-top:1.1rem;padding-top:1rem;
    border-top:1px solid var(--rule);
    font-size:.88rem;color:var(--ink);
  }
  .fine{
    margin-top:2rem;max-width:62ch;
    font-size:.9rem;color:var(--slate);
  }
  .rules-line{
    margin-top:1rem;
    font-size:.82rem;color:var(--slate);
    letter-spacing:.05em;
  }

  /* ── night ────────────────────────────────── */
  .night{
    background:var(--night);
    color:var(--night-text);
    padding:6rem 0 6rem;
  }
  .night .kicker{color:var(--sand);}
  .night-open{
    display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:end;
    margin-bottom:3rem;
  }
  .night h2{
    font-size:clamp(2.4rem,5.5vw,4rem);
    line-height:1.02;margin:0;font-weight:400;
  }
  .night-open p{margin:0;color:var(--night-dim);max-width:40ch;}
  .night-imgs{
    display:grid;grid-template-columns:1.4fr 1fr;gap:1.5rem;
    margin-bottom:5rem;
  }
  .night-imgs img{width:100%;height:100%;object-fit:cover;aspect-ratio:16/10;}

  /* form */
  .inquire{
    display:grid;grid-template-columns:1fr 1.4fr;gap:4rem;align-items:start;
    padding-top:4.5rem;
    border-top:1px solid var(--night-rule);
  }
  .inquire h2{
    font-size:clamp(1.9rem,4vw,2.7rem);
    line-height:1.1;margin:0 0 1.1rem;font-weight:400;
  }
  .inquire .body{color:var(--night-dim);margin:0 0 2rem;max-width:38ch;}
  .direct{font-size:.95rem;color:var(--night-dim);line-height:2;}
  .direct a{color:var(--night-text);text-decoration-color:var(--sand);text-underline-offset:4px;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;}
  .field{display:flex;flex-direction:column;}
  .field.full{grid-column:1/-1;}
  label{
    font-size:.7rem;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;
    color:var(--night-dim);
    margin-bottom:.5rem;
  }
  input,textarea{
    font-family:"Instrument Sans",system-ui,sans-serif;
    font-size:1rem;
    color:var(--night-text);
    background:var(--night-panel);
    border:1px solid var(--night-rule);
    padding:.85rem 1rem;
    border-radius:0;
  }
  input::placeholder,textarea::placeholder{color:#5D6B84;}
  input:focus,textarea:focus{outline:none;border-color:var(--sand);}
  input:focus-visible,textarea:focus-visible{outline:2px solid var(--sand);outline-offset:2px;}
  textarea{resize:vertical;min-height:6rem;}
  input[type="date"]{color-scheme:dark;}
  .hp{position:absolute;left:-9999px;}
  .form-grid .btn-solid{
    background:var(--sand);border-color:var(--sand);color:var(--night);
    justify-self:start;cursor:pointer;
    font-family:"Instrument Sans",sans-serif;
  }
  .form-grid .btn-solid:hover{background:#CDA97C;border-color:#CDA97C;}

  footer{
    background:var(--night);
    color:var(--night-dim);
    border-top:1px solid var(--night-rule);
    padding:2.2rem 0 3rem;
    font-size:.78rem;
    letter-spacing:.1em;text-transform:uppercase;
  }
  footer .wrap{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
  footer a{text-decoration:none;color:var(--night-dim);}
  footer a:hover{color:var(--night-text);}

  /* ── reveal ───────────────────────────────── */
  .rise{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s ease;}
  .rise.in{opacity:1;transform:none;}

  /* ── responsive ───────────────────────────── */
  @media (max-width:900px){
    .pitch .wrap,.building .wrap,.hood .inner,
    .night-open,.inquire{grid-template-columns:1fr;gap:2.2rem;}
    .room,.room:nth-child(even){grid-template-columns:1fr;gap:1.4rem;padding:2rem 0;}
    .room:nth-child(even) .room-img{order:0;}
    .rate-cards{grid-template-columns:1fr;}
    .balcony-pair,.night-imgs{grid-template-columns:1fr;}
    .hood .inner{padding:2.2rem 1.6rem;}
    .facts .wrap{grid-template-columns:repeat(2,1fr) ;}
    .fact{border-left:0;padding-left:0;border-top:1px solid var(--rule);}
    .fact:nth-child(-n+2){border-top:0;}
    .mast-phone{display:none;}
    .wordmark{font-size:.7rem;letter-spacing:.16em;max-width:12rem;line-height:1.5;}
  }
  @media (max-width:640px){
    .form-grid{grid-template-columns:1fr;}
    .hero .wrap{padding-bottom:3rem;}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    .rise{opacity:1;transform:none;transition:none;}
  }
</style>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LodgingBusiness",
  "name": "Brickell Corporate Housing — The Brickell Dream",
  "description": "Fully furnished corporate housing residence with bay and skyline views in Brickell, Miami. Weekly and monthly stays, utilities included.",
  "url": "https://brickellcorporatehousing.com",
  "telephone": "+1-310-770-7059",
  "email": "info@brickellcorporatehousing.com",
  "priceRange": "$225–$6,250",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Miami",
    "addressRegion": "FL",
    "addressCountry": "US"
  },
  "amenityFeature": [
    {"@type":"LocationFeatureSpecification","name":"Free WiFi","value":true},
    {"@type":"LocationFeatureSpecification","name":"Free parking","value":true},
    {"@type":"LocationFeatureSpecification","name":"Pool","value":true},
    {"@type":"LocationFeatureSpecification","name":"Fitness center","value":true},
    {"@type":"LocationFeatureSpecification","name":"In-unit washer/dryer","value":true},
    {"@type":"LocationFeatureSpecification","name":"Self check-in","value":true}
  ]
}
</script>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <a class="wordmark" href="#" data-bind="brand"></a>
    <div class="mast-actions">
      <a class="mast-phone" data-bind-tel data-bind="phone"></a>
      <a class="btn btn-ghost" href="#inquire">Inquire</a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <p class="eyebrow" data-bind="eyebrow"></p>
    <h1 class="serif" data-bind="heroLine"></h1>
    <p class="sub" data-bind="heroSub"></p>
    <div class="hero-ctas">
      <a class="btn btn-solid" href="#inquire">Check availability</a>
      <a class="btn btn-ghost" href="#residence">See the residence</a>
    </div>
  </div>
</section>

<section class="facts" aria-label="Key facts">
  <div class="wrap" id="facts"></div>
</section>

<section class="pitch" id="residence">
  <div class="wrap">
    <div>
      <p class="kicker">The residence</p>
      <h2 class="serif rise" data-bind="pitchHead"></h2>
    </div>
    <div>
      <p class="body rise" data-bind="pitchBody"></p>
      <ul class="inc-list rise" id="included"></ul>
    </div>
  </div>
</section>

<section class="rooms">
  <div class="wrap" id="rooms"></div>
</section>

<section class="walk" aria-label="Walkthrough">
  <div class="wrap">
    <div class="walk-grid rise">
      <figure>
        <img src="images/walk-living.jpg" alt="View from the living room across the dining table to the open kitchen" loading="lazy">
        <figcaption class="cap">From the sofa, looking back</figcaption>
      </figure>
      <figure>
        <img src="images/walk-dining.jpg" alt="Open-plan living and dining room with sectional and six-seat table" loading="lazy">
        <figcaption class="cap">One open floor, end to end</figcaption>
      </figure>
      <figure>
        <img src="images/walk-kitchen.jpg" alt="Kitchen island with coffee station looking across the dining area toward the balcony" loading="lazy">
        <figcaption class="cap">Coffee with a skyline</figcaption>
      </figure>
    </div>
  </div>
</section>

<section class="balcony">
  <div class="wrap">
    <div class="balcony-head rise">
      <p class="kicker" data-bind="balconyKicker"></p>
      <h2 class="serif" data-bind="balconyHead"></h2>
      <p data-bind="balconyBody"></p>
    </div>
  </div>
  <figure class="balcony-full rise">
    <img src="images/balcony-day.jpg" alt="27-foot wraparound balcony with Biscayne Bay and the Brickell skyline beyond" loading="lazy">
  </figure>
  <div class="wrap">
    <div class="balcony-pair rise">
      <figure>
        <img src="images/balcony-egg.jpg" alt="Hanging egg chair on the balcony against the skyline" loading="lazy">
        <figcaption class="cap">The egg chair, mid-afternoon</figcaption>
      </figure>
      <figure>
        <img src="images/balcony-night.jpg" alt="Balcony at dusk with the Brickell towers lit across the water" loading="lazy">
        <figcaption class="cap">Same rail, ten hours later</figcaption>
      </figure>
    </div>
  </div>
</section>

<section class="building">
  <div class="wrap">
    <div>
      <p class="kicker" data-bind="buildingKicker"></p>
      <h2 class="serif rise" data-bind="buildingHead"></h2>
      <p class="body rise" data-bind="buildingBody"></p>
      <div class="amen-grid rise" id="amenities"></div>
    </div>
    <div class="building-imgs rise">
      <img src="images/pool-night.jpg" alt="Heated pool lit at night at The Club at Brickell Bay" loading="lazy">
      <div class="duo">
        <img src="images/game-room.jpg" alt="Resident game room with pool table and ping pong" loading="lazy">
        <img src="images/lounge.jpg" alt="Resident lounge and co-working space" loading="lazy">
      </div>
    </div>
  </div>
</section>

<section class="hood">
  <div class="wrap">
    <div class="inner rise">
      <div>
        <p class="kicker" data-bind="hoodKicker"></p>
        <h2 class="serif" data-bind="hoodHead"></h2>
      </div>
      <p data-bind="hoodBody"></p>
    </div>
  </div>
</section>

<section class="rates-sec" id="rates">
  <div class="wrap">
    <div class="sec-head">
      <p class="kicker">Rates</p>
      <h2 class="serif rise">Simple rates, nothing hidden</h2>
    </div>
    <div class="rate-cards rise" id="rate-cards"></div>
    <p class="fine" data-bind="rateFinePrint"></p>
    <p class="rules-line" data-bind="rules"></p>
  </div>
</section>

<section class="night">
  <div class="wrap">
    <div class="night-open">
      <div>
        <p class="kicker">After dark</p>
        <h2 class="serif rise" data-bind="nightHead"></h2>
      </div>
      <p class="rise" data-bind="nightBody"></p>
    </div>
    <div class="night-imgs rise">
      <img src="images/skyline-night.jpg" alt="The Brickell skyline at night from the residence" loading="lazy">
      <img src="images/balcony-night.jpg" alt="Balcony seating at night with candles and city lights" loading="lazy">
    </div>

    <div class="inquire" id="inquire">
      <div>
        <h2 class="serif" data-bind="formHead"></h2>
        <p class="body" data-bind="formBody"></p>
        <p class="direct">
          <a data-bind-mail data-bind="email"></a><br>
          <a data-bind-tel data-bind="phone"></a>
        </p>
      </div>

      <form name="inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="form-grid">
        <input type="hidden" name="form-name" value="inquiry">
        <p class="hp"><label>Leave this field empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>

        <div class="field">
          <label for="f-name">Your name</label>
          <input id="f-name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="f-email">Email</label>
          <input id="f-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="f-in">Arriving</label>
          <input id="f-in" name="arriving" type="date">
        </div>
        <div class="field">
          <label for="f-out">Leaving</label>
          <input id="f-out" name="leaving" type="date">
        </div>
        <div class="field">
          <label for="f-guests">Guests</label>
          <input id="f-guests" name="guests" type="number" min="1" max="4" inputmode="numeric" placeholder="1–4">
        </div>
        <div class="field">
          <label for="f-phone">Phone <span style="text-transform:none;letter-spacing:0;">(optional)</span></label>
          <input id="f-phone" name="phone" type="tel" autocomplete="tel">
        </div>
        <div class="field full">
          <label for="f-msg">Anything we should know</label>
          <textarea id="f-msg" name="message" rows="4" placeholder="Company stay, relocation, questions about the space…"></textarea>
        </div>
        <div class="field full">
          <button type="submit" class="btn btn-solid">Send inquiry</button>
        </div>
      </form>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <span data-bind="brand"></span>
    <span><a data-bind-mail data-bind="email"></a></span>
    <span id="copyright"></span>
  </div>
</footer>

<script>
(function(){
  const C = CONTENT;

  document.querySelectorAll("[data-bind]").forEach(el=>{
    const v = C[el.dataset.bind];
    if(v) el.textContent = v;
  });
  document.querySelectorAll("[data-bind-mail]").forEach(el=> el.href = "mailto:" + C.email);
  document.querySelectorAll("[data-bind-tel]").forEach(el=> el.href = "tel:" + C.phoneHref);
  document.getElementById("copyright").textContent = "© " + new Date().getFullYear() + " " + C.brand;

  document.getElementById("facts").innerHTML = C.facts.map(f=>
    `<div class="fact"><div class="value">${f.value}</div><div class="label">${f.label}</div></div>`
  ).join("");

  document.getElementById("included").innerHTML = C.included.map(i=>`<li>${i}</li>`).join("");

  document.getElementById("rooms").innerHTML = C.rooms.map(r=>
    `<div class="room rise">
       <div class="room-img"><img src="images/${r.img}.jpg" alt="${r.alt}" loading="lazy"></div>
       <div>
         <p class="kicker">${r.kicker}</p>
         <h3>${r.head}</h3>
         <p>${r.body}</p>
         ${r.stat ? `<div class="room-stat"><span class="value">${r.stat.value}</span><span class="label">${r.stat.label}</span></div>` : ""}
       </div>
     </div>`
  ).join("");

  document.getElementById("amenities").innerHTML = C.buildingAmenities.map(a=>
    `<div class="amen">${a}</div>`
  ).join("");

  document.getElementById("rate-cards").innerHTML = C.rates.map(r=>
    `<div class="rate-card${r.featured ? " featured" : ""}">
       <span class="period">${r.period}</span>
       <span class="price serif">${r.price}</span>
       <span class="per">${r.per}</span>
       <span class="note">${r.note}</span>
     </div>`
  ).join("");

  const io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }});
  },{threshold:.12});
  document.querySelectorAll(".rise").forEach(el=>io.observe(el));
})();
</script>
</body>
</html>
